name: Pages

# Builds the web app and publishes it to the gh-pages branch; GitHub Pages
# serves that branch directly (Settings -> Pages -> "Deploy from a branch":
# gh-pages, /). Kept as a plain branch-deploy workflow (no
# configure-pages/upload-pages-artifact/deploy-pages) so it doesn't depend on
# the Pages-via-Actions build type.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages
        env:
          SITE_DIR: dist # web/dist, since this job's working-directory is web
        run: |
          cd "$SITE_DIR"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
