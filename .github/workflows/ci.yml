name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Node formats numbers and dates for the locale it starts in. Output that must not
      # change with the reader's locale is tested in one that writes 1.234,5.
      - name: Test again in a comma-decimal locale
        run: npm test
        env:
          LC_ALL: de_DE.UTF-8
          LANG: de_DE.UTF-8
      - run: npm run build

      - name: Verify dist/cli.js is up to date
        run: |
          git diff --exit-code -- dist/cli.js || {
            echo "::error::dist/cli.js is stale. Run 'npm run build' and commit the result.";
            exit 1;
          }

      - name: Self-scan (repo's own source and docs must be clean)
        run: node dist/cli.js src action.yml package.json tsconfig.json tsconfig.build.json eslint.config.js esbuild.cli.mjs .pre-commit-hooks.yaml README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md

      - name: Benchmark smoke test
        run: node scripts/benchmark.mjs 2

  action-self-test:
    name: Action self-test (uses ./)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Must pass on real source
        uses: ./
        with:
          paths: 'src action.yml package.json README.md'
          format: pretty

      - name: Must fail on examples/fixtures
        id: fixtures
        uses: ./
        continue-on-error: true
        with:
          paths: 'examples/fixtures'
          format: pretty

      - name: Assert the fixtures step actually failed
        run: |
          if [ "${{ steps.fixtures.outcome }}" != "failure" ]; then
            echo "::error::expected the Action to fail on examples/fixtures (it contains a known bidi-control finding), but it reported '${{ steps.fixtures.outcome }}'."
            exit 1
          fi
          echo "ok: the Action correctly failed on examples/fixtures/bad.js"

  web:
    name: web app (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  minimum-node:
    name: the built CLI on the oldest supported Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      # `engines.node` in package.json says >=20. The tests run on the Node that builds;
      # this runs what was built on the oldest Node that range allows.
      - uses: actions/setup-node@v7
        with:
          node-version: "20.0.0"
      - name: Run the CLI on Node 20.0.0
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js reveal examples/trojan-source.c
          # The examples are attacks: exit code 1 (findings) is the right answer, 2 would be a crash.
          code=0; node dist/cli.js examples --no-config > /dev/null || code=$?
          test "$code" -eq 1
